<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幕末激動インタラクティブ・アナライザー（教科書準拠版）</title>
    <style>
        :root {
            --chosu-color: #ef4444;
            --satsuma-color: #3b82f6;
            --bakufu-color: #10b981;
            --chotei-color: #a855f7;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-light: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            padding: 20px;
            font-size: 18px;
            line-height: 1.6;
            max-width: 1500px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            margin-bottom: 16px;
        }

        header h1 {
            font-size: 2.3rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 1px;
        }

        header p {
            font-size: 1rem;
            color: #94a3b8;
            margin-top: 4px;
        }

        /* ステップナビゲーション */
        .step-nav {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .step-btn {
            flex: 1;
            padding: 12px 10px;
            border: 3px solid #475569;
            background: #1e293b;
            color: #cbd5e1;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.05rem;
            text-align: center;
            min-width: 105px;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .step-btn:hover {
            background: #334155;
            color: #fff;
        }

        .step-btn.active {
            border-color: #38bdf8;
            background: #0284c7;
            color: #ffffff;
            transform: scale(1.03);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        .step-btn.year-end {
            border-right: 6px solid #f59e0b;
        }

        /* 操作ボタン */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            margin-bottom: 18px;
        }

        .ctrl-btn {
            padding: 12px 34px;
            font-size: 1.25rem;
            font-weight: bold;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            background: #f8fafc;
            color: #0f172a;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
        }

        .ctrl-btn:hover {
            background: #e2e8f0;
            transform: translateY(-2px);
        }

        .step-counter {
            font-size: 1.35rem;
            font-weight: bold;
            color: #38bdf8;
        }

        /* 因果関係表示カード */
        .cause-effect-card {
            background: #1e293b;
            border-radius: 16px;
            padding: 22px 30px;
            margin-bottom: 22px;
            border-left: 10px solid #38bdf8;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .ce-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .ce-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .ce-section {
            font-size: 1rem;
            font-weight: 800;
            color: #cbd5e1;
            background: #334155;
            padding: 4px 14px;
            border-radius: 20px;
        }

        .ce-year {
            font-size: 1.25rem;
            font-weight: 900;
            color: #0f172a;
            background: #38bdf8;
            padding: 5px 18px;
            border-radius: 30px;
        }

        .year-end-badge {
            display: none;
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
            background: #f59e0b;
            padding: 6px 20px;
            border-radius: 30px;
            animation: pulse 1.5s infinite;
        }

        .ce-title {
            font-size: 1.75rem;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .ce-flow {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #0f172a;
            padding: 16px 22px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .ce-item {
            font-size: 1.25rem;
            line-height: 1.6;
            font-weight: 600;
        }

        .ce-item .label {
            font-weight: 900;
            padding: 2px 10px;
            border-radius: 6px;
            margin-right: 10px;
            display: inline-block;
        }

        .label-cause {
            background: #ef4444;
            color: #fff;
        }

        .label-action {
            background: #3b82f6;
            color: #fff;
        }

        .label-result {
            background: #10b981;
            color: #fff;
        }

        /* 注釈ボックス */
        .ce-note {
            margin-top: 12px;
            padding: 12px 18px;
            background: rgba(56, 189, 248, 0.12);
            border-left: 4px solid #38bdf8;
            border-radius: 8px;
            font-size: 1.1rem;
            color: #bae6fd;
            line-height: 1.5;
            display: none;
        }

        .ce-note strong {
            color: #38bdf8;
        }

        /* メインレイアウト（4大勢力グリッド） */
        .stage-area {
            position: relative;
            flex-grow: 1;
            margin-top: 8px;
        }

        .faction-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 32px;
            min-height: 540px;
            position: relative;
            z-index: 1;
        }

        .faction-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px 28px;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.4s ease;
            position: relative;
            border: 4px solid transparent;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            opacity: 0.38;
            filter: grayscale(35%);
        }

        .faction-card.active-step {
            opacity: 1;
            filter: grayscale(0%);
            transform: scale(1.02);
            border-color: #fbbf24;
            box-shadow: 0 0 25px rgba(251, 191, 36, 0.4);
            z-index: 2;
        }

        .faction-card.year-complete {
            opacity: 1;
            filter: grayscale(0%);
        }

        .faction-card.chosu {
            background: linear-gradient(135deg, #1e293b 0%, #450a0a 100%);
            border-top: 8px solid var(--chosu-color);
        }

        .faction-card.satsuma {
            background: linear-gradient(135deg, #1e293b 0%, #172554 100%);
            border-top: 8px solid var(--satsuma-color);
        }

        .faction-card.bakufu {
            background: linear-gradient(135deg, #1e293b 0%, #064e3b 100%);
            border-top: 8px solid var(--bakufu-color);
        }

        .faction-card.chotei {
            background: linear-gradient(135deg, #1e293b 0%, #3b0764 100%);
            border-top: 8px solid var(--chotei-color);
        }

        .faction-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 12px;
            margin-bottom: 14px;
        }

        .faction-name {
            font-size: 2.1rem;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .faction-leader {
            font-size: 1.15rem;
            background: rgba(255, 255, 255, 0.15);
            padding: 5px 16px;
            border-radius: 20px;
            font-weight: 700;
        }

        /* 人名リンク */
        .person-link {
            color: #38bdf8;
            text-decoration: underline;
            text-decoration-thickness: 2px;
            text-underline-offset: 4px;
            cursor: pointer;
            font-weight: 800;
            transition: all 0.2s ease;
            border-radius: 6px;
            padding: 1px 4px;
        }

        .person-link:hover {
            color: #ffffff;
            background: rgba(56, 189, 248, 0.25);
        }

        .faction-leader .person-link {
            color: #fde047;
        }

        .faction-leader .person-link:hover {
            color: #ffffff;
            background: rgba(253, 224, 71, 0.25);
        }

        .speech-box .person-link {
            color: #0284c7;
        }

        .speech-box .person-link:hover {
            color: #0369a1;
            background: rgba(2, 132, 199, 0.12);
        }

        /* 人物イラスト表示モーダル */
        .person-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .person-modal-overlay.open {
            display: flex;
            animation: fadeIn 0.2s ease;
        }

        .person-modal {
            background: #1e293b;
            border: 3px solid #38bdf8;
            border-radius: 24px;
            padding: 28px 32px;
            max-width: 720px;
            width: 100%;
            text-align: center;
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .person-modal-close {
            position: absolute;
            top: 14px;
            right: 16px;
            background: #334155;
            color: #f8fafc;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
            transition: background 0.2s ease;
        }

        .person-modal-close:hover {
            background: #ef4444;
        }

        .person-modal-faction {
            display: inline-block;
            font-size: 0.95rem;
            font-weight: 800;
            padding: 4px 14px;
            border-radius: 20px;
            background: #334155;
            color: #e2e8f0;
            margin-bottom: 8px;
        }

        .person-modal-name {
            font-size: 1.9rem;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 16px;
        }

        .person-modal-compare {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-bottom: 16px;
        }

        .person-modal-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .person-modal-card-label {
            font-size: 0.95rem;
            font-weight: 800;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.14);
            padding: 4px 14px;
            border-radius: 20px;
            margin-bottom: 10px;
        }

        .person-modal-img-wrap {
            background: #ffffff;
            border-radius: 12px;
            padding: 12px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 290px;
        }

        .person-modal-img-wrap img {
            max-width: 100%;
            max-height: 266px;
            object-fit: contain;
            border-radius: 6px;
        }

        .person-modal-desc {
            font-size: 1rem;
            color: #cbd5e1;
            background: #0f172a;
            border-left: 4px solid #38bdf8;
            padding: 10px 16px;
            border-radius: 8px;
            text-align: left;
            line-height: 1.5;
        }

        /* 画像1枚だけの表示モード（ええじゃないか等の出来事の絵） */
        .person-modal-compare.single {
            grid-template-columns: 1fr;
        }

        .person-modal-compare.single .person-modal-img-wrap {
            height: auto;
            max-height: 460px;
        }

        .person-modal-compare.single .person-modal-img-wrap img {
            max-height: 436px;
        }

        @media (max-width: 640px) {
            .person-modal-compare {
                grid-template-columns: 1fr;
            }
            .person-modal-img-wrap {
                height: 220px;
            }
            .person-modal-img-wrap img {
                max-height: 196px;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* 吹き出し（心の声） */
        .speech-box {
            background: #ffffff;
            color: #0f172a;
            border-radius: 14px;
            padding: 16px 20px;
            font-size: 1.3rem;
            font-weight: 800;
            line-height: 1.5;
            position: relative;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
            margin-top: 6px;
            margin-bottom: 12px;
        }

        .speech-box::before {
            content: '';
            position: absolute;
            top: -12px;
            left: 30px;
            border-width: 0 12px 12px 12px;
            border-style: solid;
            border-color: transparent transparent #ffffff transparent;
        }

        .status-tag {
            font-size: 1.15rem;
            font-weight: bold;
            display: inline-block;
            padding: 6px 16px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
            align-self: flex-start;
        }

        /* オーバーレイ関係線用エリア（SVG） */
        .relations-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
        }

        /* 関係性バッジ */
        .relation-badge {
            position: absolute;
            font-size: 1.15rem;
            font-weight: 900;
            padding: 8px 18px;
            border-radius: 30px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
            transform: translate(-50%, -50%);
            white-space: nowrap;
            z-index: 10;
            border: 3px solid;
        }

        .relation-badge.vs {
            background: #450a0a;
            color: #fca5a5;
            border-color: #ef4444;
        }

        .relation-badge.ally {
            background: #172554;
            color: #93c5fd;
            border-color: #3b82f6;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        @media (max-width: 950px) {
            .faction-grid {
                grid-template-columns: 1fr;
            }

            .faction-name {
                font-size: 1.8rem;
            }

            .speech-box {
                font-size: 1.15rem;
            }

            .ce-title {
                font-size: 1.4rem;
            }

            .ce-item {
                font-size: 1.1rem;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>幕末の因果関係＆勢力変化マップ</h1>
        <p>教科書記述に忠実な12ステップ・因果構造アナライザー</p>
    </header>

    <!-- 順序ステップボタン -->
    <div class="step-nav" id="stepNav"></div>

    <!-- コントローラー -->
    <div class="controls">
        <button class="ctrl-btn" onclick="prevStep()">◀ 前の出来事</button>
        <span class="step-counter" id="stepCounter">Step 1 / 12</span>
        <button class="ctrl-btn" onclick="nextStep()">次の出来事 ▶</button>
    </div>

    <!-- 因果関係カード -->
    <div class="cause-effect-card">
        <div class="ce-header">
            <div class="ce-header-left">
                <span class="ce-section" id="ceSection">［薩摩藩と長州藩の動き］</span>
                <span class="ce-year" id="ceYear">1863年</span>
            </div>
            <span class="year-end-badge" id="yearEndBadge">✨ 1863年の4勢力が出そろいました！</span>
        </div>
        <div class="ce-title" id="ceTitle">出来事タイトル</div>
        <div class="ce-flow">
            <div class="ce-item"><span class="label label-cause">原因</span><span id="textCause">―</span></div>
            <div class="ce-item"><span class="label label-action">出来事</span><span id="textAction">―</span></div>
            <div class="ce-item"><span class="label label-result">結果・影響</span><span id="textResult">―</span></div>
        </div>
        <div class="ce-note" id="ceNote"></div>
    </div>

    <!-- 4大勢力ステージ -->
    <div class="stage-area">
        <!-- 勢力間関係線描画用SVG -->
        <svg class="relations-overlay" id="relationsSvg"></svg>

        <!-- 関係ラベル設置用コンテナ -->
        <div id="badgesContainer"></div>

        <div class="faction-grid">
            <!-- 長州藩 -->
            <div class="faction-card chosu" id="cardChosu">
                <div class="faction-header">
                    <span class="faction-name">🔴 長州藩（山口県）</span>
                    <span class="faction-leader"><a href="takasugi_shinsaku.png" class="person-link" onclick="openPersonModal(event, 'takasugi')">高杉晋作</a>・<a href="kido_takayoshi_katsura_kogorou.png" class="person-link" onclick="openPersonModal(event, 'kido')">木戸孝允</a></span>
                </div>
                <div class="speech-box" id="speechChosu">―</div>
                <span class="status-tag" id="statusChosu">待機中</span>
            </div>

            <!-- 薩摩藩 -->
            <div class="faction-card satsuma" id="cardSatsuma">
                <div class="faction-header">
                    <span class="faction-name">🔵 薩摩藩（鹿児島県）</span>
                    <span class="faction-leader"><a href="nigaoe_saigoutakamori.png" class="person-link" onclick="openPersonModal(event, 'saigo')">西郷隆盛</a>・<a href="okubo_toshimichi.png" class="person-link" onclick="openPersonModal(event, 'okubo')">大久保利通</a></span>
                </div>
                <div class="speech-box" id="speechSatsuma">―</div>
                <span class="status-tag" id="statusSatsuma">待機中</span>
            </div>

            <!-- 幕府 -->
            <div class="faction-card bakufu" id="cardBakufu">
                <div class="faction-header">
                    <span class="faction-name">🟢 幕府（江戸）</span>
                    <span class="faction-leader"><a href="nigaoe_tokugawa_yoshinobu.png" class="person-link" onclick="openPersonModal(event, 'yoshinobu')">徳川慶喜</a></span>
                </div>
                <div class="speech-box" id="speechBakufu">―</div>
                <span class="status-tag" id="statusBakufu">待機中</span>
            </div>

            <!-- 朝廷 -->
            <div class="faction-card chotei" id="cardChotei">
                <div class="faction-header">
                    <span class="faction-name">🟣 朝廷（京都）</span>
                    <span class="faction-leader"><a href="photo_meiji_tenno.jpg" class="person-link" onclick="openPersonModal(event, 'tenno')">天皇</a>・<a href="nigaoe_iwakura_tomomi.png" class="person-link" onclick="openPersonModal(event, 'iwakura')">岩倉具視</a></span>
                </div>
                <div class="speech-box" id="speechChotei">―</div>
                <span class="status-tag" id="statusChotei">待機中</span>
            </div>
        </div>
    </div>

    <!-- 人物イラスト＆実物写真 比較表示モーダル -->
    <div class="person-modal-overlay" id="personModalOverlay" onclick="closePersonModal(event)">
        <div class="person-modal" onclick="event.stopPropagation()">
            <button class="person-modal-close" onclick="closePersonModal()" aria-label="閉じる">×</button>
            <div class="person-modal-faction" id="personModalFaction"></div>
            <div class="person-modal-name" id="personModalName"></div>
            <div class="person-modal-compare" id="personModalCompare">
                <div class="person-modal-card">
                    <div class="person-modal-card-label" id="personModalLabelLeft">🎨 イラスト</div>
                    <div class="person-modal-img-wrap">
                        <img id="personModalImgLeft" src="" alt="">
                    </div>
                </div>
                <div class="person-modal-card" id="personModalCardRight">
                    <div class="person-modal-card-label" id="personModalLabelRight">📸 実物写真（教科書掲載）</div>
                    <div class="person-modal-img-wrap">
                        <img id="personModalImgRight" src="" alt="">
                    </div>
                </div>
            </div>
            <div class="person-modal-desc" id="personModalDesc"></div>
        </div>
    </div>

    <script>
        // 教科書本文・注釈に100%忠実な12ステップデータ
        const steps = [
            // --- ［薩摩藩と長州藩の動き］ ---
            {
                year: "1863年",
                subStep: "1863年 (1/2)",
                section: "［薩摩藩と長州藩の動き］",
                title: "① 長州藩による攘夷の実行と外国船砲撃",
                cause: "尊王攘夷運動の中心だった長州藩（山口県）が朝廷を動かした。",
                action: "幕府に攘夷の実行を約束させ、率先して関門海峡を通る外国船を砲撃した！",
                result: "長州藩が率先して攘夷を実行に移した。",
                note: "",
                activeFactions: ["chosu", "bakufu", "chotei"],
                relations: [
                    { from: "chosu", to: "chotei", type: "ally", label: "朝廷を動かす" },
                    { from: "chosu", to: "bakufu", type: "vs", label: "攘夷を実行させる" }
                ],
                isYearEnd: false,
                factions: {
                    chosu: { speech: "「朝廷を動かし、幕府に攘夷の実行を約束させたぞ！率先して関門海峡を通る外国船を砲撃だ！」", status: "⚡ 率先して砲撃" },

                rightLabel: "🖼️ 肖像画（教科書掲載・キヨッソーネ画）",
                rightImg: "photo_saigo_takamori.jpg",
                desc: "薩摩藩の中心人物。大久保利通とともに藩の実権をにぎり、薩長同盟・王政復古・戊辰戦争を主導しました（※本人の写真は残っておらず、親族の顔をもとに描かれた肖像画が教科書に掲載されています）。"
            },
            okubo: {
                name: "大久保 利通（おおくぼ としみち）",
                faction: "🔵 薩摩藩（鹿児島県）",
                leftLabel: "🎨 イラスト",
                leftImg: "okubo_toshimichi.png",
                rightLabel: "📸 実物写真（教科書掲載）",
                rightImg: "photo_okubo_toshimichi.jpg",
                desc: "薩摩藩の中心人物。西郷隆盛とともに藩政をリードし、王政復古の大号令や明治新政府の樹立・改革を推進しました。"
            },
            yoshinobu: {
                name: "徳川 慶喜（とくがわ よしのぶ）",
                faction: "🟢 幕府（江戸）",
                leftLabel: "🎨 イラスト",
                leftImg: "nigaoe_tokugawa_yoshinobu.png",
                rightLabel: "📸 実物写真（教科書掲載・将軍時代）",
                rightImg: "photo_tokugawa_yoshinobu.jpg",
                desc: "江戸幕府の第15代（最後）の将軍。1867年に土佐藩のすすめで政権を朝廷に返上（大政奉還）しました。"
            },
            iwakura: {
                name: "岩倉 具視（いわくら ともみ）",
                faction: "🟣 朝廷（京都）",
                leftLabel: "🎨 イラスト",
                leftImg: "nigaoe_iwakura_tomomi.png",
                rightLabel: "📸 実物写真（教科書掲載）",
                rightImg: "photo_iwakura_tomomi.jpg",
                desc: "朝廷の公家。薩摩藩の西郷隆盛・大久保利通らと協力して「王政復古の大号令」を出し、新政府の中枢を担いました。"
            },
            tenno: {
                name: "明治天皇（めいじてんのう）",
                faction: "🟣 朝廷（京都）",
                leftLabel: "📸 実物写真（1872年・伝統的な装束姿）",
                leftImg: "photo_meiji_tenno_1872.jpg",
                rightLabel: "📸 実物写真（教科書掲載・1873年・洋装の軍服姿）",
                rightImg: "photo_meiji_tenno.jpg",
                desc: "王政復古の大号令により樹立された新政府の中心。伝統的な装束姿（左・1872年）から、断髪して西洋式の軍服姿（右・1873年）へと変化した写真は、日本の近代化を象徴するものとして教科書でも有名です。"
            },
            // 出来事の絵（画像1枚だけ表示：rightImg なし）
            eejanaika: {
                name: "ええじゃないか（1867年）",
                faction: "🎎 民衆の動き（世直しへの期待）",
                leftLabel: "🖼️ 当時の絵（河鍋暁斎 画・1867年）",
                leftImg: "photo_eejanaika.jpg",
                desc: "1867年、空から伊勢神宮などのお札が降ったといううわさをきっかけに、民衆が「ええじゃないか」と唱えながら熱狂して踊る騒ぎが、東海・近畿地方を中心に各地へ広がりました。\n出典：河鍋暁斎「ええじゃないか」（国立国会図書館デジタルコレクション／Wikimedia Commons、パブリックドメイン）"
            }
        };

        const nameToKey = {
            "高杉晋作": "takasugi",
            "木戸孝允": "kido",
            "西郷隆盛": "saigo",
            "西郷": "saigo",
            "大久保利通": "okubo",
            "徳川慶喜": "yoshinobu",
            "慶喜": "yoshinobu",
            "岩倉具視": "iwakura",
            "明治天皇": "tenno",
            "天皇": "tenno",
            "ええじゃないか": "eejanaika"
        };

        function linkifyNames(text) {
            if (!text) return "";
            return text.replace(/高杉晋作|木戸孝允|西郷隆盛|西郷|大久保利通|徳川慶喜|慶喜|岩倉具視|明治天皇|天皇|ええじゃないか/g, (match) => {
                const key = nameToKey[match];
                const p = persons[key];
                return `<a href="${p.rightImg || p.leftImg}" class="person-link" onclick="openPersonModal(event, '${key}')">${match}</a>`;
            });
        }

        function openPersonModal(event, key) {
            if (event) event.preventDefault();
            const p = persons[key];
            if (!p) return;

            document.getElementById('personModalFaction').innerText = p.faction;
            document.getElementById('personModalName').innerText = p.name;

            document.getElementById('personModalLabelLeft').innerText = p.leftLabel;
            const imgLeft = document.getElementById('personModalImgLeft');
            imgLeft.src = p.leftImg;
            imgLeft.alt = `${p.name} (${p.leftLabel})`;

            // 右側の画像がない場合は1枚だけ大きく表示する
            const compare = document.getElementById('personModalCompare');
            const cardRight = document.getElementById('personModalCardRight');
            const imgRight = document.getElementById('personModalImgRight');
            if (p.rightImg) {
                compare.classList.remove('single');
                cardRight.style.display = '';
                document.getElementById('personModalLabelRight').innerText = p.rightLabel;
                imgRight.src = p.rightImg;
                imgRight.alt = `${p.name} (${p.rightLabel})`;
            } else {
                compare.classList.add('single');
                cardRight.style.display = 'none';
                imgRight.src = '';
            }

            document.getElementById('personModalDesc').innerText = p.desc;

            document.getElementById('personModalOverlay').classList.add('open');
        }

        function closePersonModal(event) {
            document.getElementById('personModalOverlay').classList.remove('open');
        }

        let currentStepIndex = 0;

        function init() {
            const nav = document.getElementById('stepNav');
            nav.innerHTML = '';

            steps.forEach((s, idx) => {
                const btn = document.createElement('button');
                btn.className = `step-btn ${idx === 0 ? 'active' : ''} ${s.isYearEnd ? 'year-end' : ''}`;
                btn.onclick = () => renderStep(idx);
                btn.innerText = s.subStep;
                nav.appendChild(btn);
            });

            renderStep(0);
            window.addEventListener('resize', drawLines);
        }

        function renderStep(index) {
            currentStepIndex = index;
            const data = steps[index];

            // ボタンのアクティブ状態
            const btns = document.querySelectorAll('.step-btn');
            btns.forEach((btn, i) => {
                if (i === index) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            // ステップカウンター
            document.getElementById('stepCounter').innerText = `Step ${index + 1} / ${steps.length}`;

            // 因果関係カードの更新
            document.getElementById('ceSection').innerText = data.section;
            document.getElementById('ceYear').innerText = data.year;
            document.getElementById('ceTitle').innerHTML = linkifyNames(data.title);
            document.getElementById('textCause').innerHTML = linkifyNames(data.cause);
            document.getElementById('textAction').innerHTML = linkifyNames(data.action);
            document.getElementById('textResult').innerHTML = linkifyNames(data.result);

            // 注釈ボックスの更新
            const noteEl = document.getElementById('ceNote');
            if (data.note) {
                noteEl.innerHTML = `<strong>【教科書注記】</strong> ${linkifyNames(data.note)}`;
                noteEl.style.display = 'block';
            } else {
                noteEl.style.display = 'none';
            }

            // 年末バッジ
            const badge = document.getElementById('yearEndBadge');
            if (data.isYearEnd) {
                badge.innerText = `✨ ${data.year} の4勢力が出そろいました！`;
                badge.style.display = 'inline-block';
            } else {
                badge.style.display = 'none';
            }

            // 4大勢力カードの更新
            const factionKeys = ['chosu', 'satsuma', 'bakufu', 'chotei'];

            factionKeys.forEach(key => {
                const card = document.getElementById(`card${capitalize(key)}`);
                const speech = document.getElementById(`speech${capitalize(key)}`);
                const status = document.getElementById(`status${capitalize(key)}`);
                const fData = data.factions[key];

                speech.innerHTML = linkifyNames(fData.speech);
                status.innerText = fData.status;

                card.classList.remove('active-step', 'year-complete');

                if (data.activeFactions.includes(key)) {
                    card.classList.add('active-step');
                }

                if (data.isYearEnd) {
                    card.classList.add('year-complete');
                }
            });

            // 関係線の描画
            setTimeout(drawLines, 50);
        }

        function drawLines() {
            const svg = document.getElementById('relationsSvg');
            const badgesContainer = document.getElementById('badgesContainer');
            svg.innerHTML = '';
            badgesContainer.innerHTML = '';

            const data = steps[currentStepIndex];
            if (!data.relations || data.relations.length === 0) return;

            const stageRect = document.querySelector('.stage-area').getBoundingClientRect();

            data.relations.forEach(rel => {
                const fromCard = document.getElementById(`card${capitalize(rel.from)}`);
                const toCard = document.getElementById(`card${capitalize(rel.to)}`);

                if (!fromCard || !toCard) return;

                const rectA = fromCard.getBoundingClientRect();
                const rectB = toCard.getBoundingClientRect();

                const x1 = rectA.left + rectA.width / 2 - stageRect.left;
                const y1 = rectA.top + rectA.height / 2 - stageRect.top;
                const x2 = rectB.left + rectB.width / 2 - stageRect.left;
                const y2 = rectB.top + rectB.height / 2 - stageRect.top;

                // SVGラインの生成
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', x1);
                line.setAttribute('y1', y1);
                line.setAttribute('x2', x2);
                line.setAttribute('y2', y2);
                line.setAttribute('stroke', rel.type === 'vs' ? '#ef4444' : '#3b82f6');
                line.setAttribute('stroke-width', '6');
                line.setAttribute('stroke-dasharray', rel.type === 'vs' ? '8 6' : 'none');
                svg.appendChild(line);

                // 重なり防止不透明関係ラベルバッジの生成
                const midX = (x1 + x2) / 2;
                const midY = (y1 + y2) / 2;

                const badge = document.createElement('div');
                badge.className = `relation-badge ${rel.type}`;
                badge.style.left = `${midX}px`;
                badge.style.top = `${midY}px`;
                badge.innerText = rel.label;

                badgesContainer.appendChild(badge);
            });
        }

        function capitalize(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        function nextStep() {
            if (currentStepIndex < steps.length - 1) {
                renderStep(currentStepIndex + 1);
            } else {
                renderStep(0);
            }
        }

        function prevStep() {
            if (currentStepIndex > 0) {
                renderStep(currentStepIndex - 1);
            }
        }

        // キーボード操作対応（左右矢印キーでステップ移動・Escでモーダルを閉じる）
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closePersonModal();
                return;
            }
            if (e.key === 'ArrowRight') nextStep();
            if (e.key === 'ArrowLeft') prevStep();
        });

        window.onload = init;
    </script>
</body>

</html>
